@property --dsp-p {
  syntax: "<percentage>";
  /* must inherit: the value is set on the row, the band is drawn by ::after */
  inherits: true;
  initial-value: 0%;
}
[data-row-key^="session:"] {
  position: relative;
  isolation: isolate;
}
[data-row-key^="session:"]::after {
  content: "";
  position: absolute;
  z-index: -2;
  pointer-events: none;
  inset-block: 0;
  inset-inline-start: 0;
  /* The paint (background, radius, thickness, clip) comes from the look
     stylesheet below, which the settings can swap at runtime. */
  width: var(--dsp-p, 0%);
  opacity: var(--dsp-o, 0);
  transition:
    --dsp-p 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
    opacity 280ms ease;
}
/* A highlight that keeps travelling inside the filled part, so a band that has
   not moved for half a minute still looks alive. It rides on ::before rather
   than ::after because the fill already owns ::after; z-index -1 puts it over
   the fill (-2) and both stay under the row's text.

   The pattern is periodic and the animation shifts it by exactly one period, so
   the loop has no seam and no dead time: something is always crossing the band,
   regardless of how wide the band happens to be. */
[data-row-key^="session:"]::before {
  content: "";
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  width: 100%;
  border-radius: inherit;
  z-index: -1;
  pointer-events: none;
  clip-path: inset(0 calc(100% - var(--dsp-p, 0%)) 0 0);
  /* A dark tail followed by a bright edge: the tail is what makes the sweep
     readable on a light fill like #90AFFF (white alone washes out), the edge is
     what makes it readable on a dark one. Period 122px along the 100deg axis,
     i.e. 123.9px across the row -- the keyframes move by exactly that much. */
  background-image: repeating-linear-gradient(
    100deg,
    rgba(0, 0, 0, 0) 0px,
    rgba(0, 0, 0, 0.2) 44px,
    rgba(255, 255, 255, 0.95) 54px,
    rgba(255, 255, 255, 0) 64px,
    rgba(0, 0, 0, 0) 122px
  );
  background-repeat: repeat;
  /* duration comes from the look sheet so the speed setting can change it */
  animation: dsp-flow var(--dsp-flow-duration, 3.6s) linear infinite;
  /* the highlight fades in and out with the band, never on its own */
  opacity: var(--dsp-o, 0);
  transition:
    clip-path 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
    opacity 280ms ease;
}
@keyframes dsp-flow {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 123.9px 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  [data-row-key^="session:"]::after {
    transition: none;
  }
  [data-row-key^="session:"]::before {
    animation: none;
    transition: none;
    opacity: 0;
  }
}
.dsp-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px 0 8px;
  font-size: 12px;
  color: var(--dsw-alias-label-primary, inherit);
}
.dsp-error {
  padding: 4px 10px;
  border-radius: 6px;
  background: rgba(255, 107, 107, 0.12);
  color: #ff8080;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
}
.dsp-empty {
  padding: 14px 10px;
  border: 1px dashed rgba(128, 128, 128, 0.35);
  border-radius: 8px;
  color: var(--dsw-alias-label-tertiary, #888);
}
/* One sample is one line. The bordered box, the eight-field meta row that
   wrapped onto three lines and the raw JSON under every sample were most of the
   noise: the technical detail now lives one click away. */
.dsp-row {
  display: flex;
  flex-direction: column;
}
.dsp-row + .dsp-row {
  border-top: 1px solid rgba(128, 128, 128, 0.12);
}
.dsp-row-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  margin: 0;
  padding: 4px 5px;
  border: none;
  border-radius: 5px;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.dsp-row-line:hover {
  background: rgba(128, 128, 128, 0.1);
}
.dsp-row-time {
  flex: none;
  width: 56px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  color: var(--dsw-alias-label-tertiary, #888);
  font-variant-numeric: tabular-nums;
}
.dsp-row-p {
  flex: none;
  width: 34px;
  text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--dsw-alias-label-primary, #fff);
  font-variant-numeric: tabular-nums;
}
.dsp-row-p.bad {
  color: #ff8080;
}
.dsp-row-delta {
  flex: none;
  width: 26px;
  text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.dsp-row-delta.up {
  color: rgb(126, 202, 158);
}
.dsp-row-delta.down {
  color: rgb(255, 168, 120);
}
.dsp-row-note {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--dsw-alias-label-primary, inherit);
}
.dsp-row.failed .dsp-row-note {
  color: #ff8080;
}
.dsp-row-ms {
  flex: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  color: var(--dsw-alias-label-tertiary, #888);
  font-variant-numeric: tabular-nums;
}
.dsp-row-detail {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0 5px 6px;
  padding: 6px 8px;
  border-left: 2px solid rgba(144, 175, 255, 0.45);
  border-radius: 0 6px 6px 0;
  background: rgba(128, 128, 128, 0.08);
}
.dsp-detail-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  color: var(--dsw-alias-label-tertiary, #888);
}
/* One column per session, left to right: the head names the session, the body
   scrolls its own samples, so several running sessions stay comparable. */
.dsp-columns {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 12px;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 2px;
}
.dsp-column {
  flex: 1 1 300px;
  min-width: 264px;
  max-width: 480px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(128, 128, 128, 0.22);
  border-radius: 10px;
  overflow: hidden;
  background: var(--dsw-alias-bg-layer-1, transparent);
}
/* Inside the full-height rail panel the columns take the remaining height and
   scroll on their own; in the settings card they simply grow with the page. */
.dsp-panel-body > .dsp-columns {
  flex: 1;
  align-items: stretch;
}
.dsp-panel-body > .dsp-columns > .dsp-column {
  max-height: 100%;
}
.dsp-column-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-bottom: 1px solid rgba(128, 128, 128, 0.22);
  background: var(--dsw-alias-bg-layer-2, rgba(128, 128, 128, 0.1));
}
.dsp-column-title {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--dsw-alias-label-primary, inherit);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dsp-tokens {
  font-variant-numeric: tabular-nums;
}
.dsp-sub-group {
  white-space: nowrap;
}
.dsp-switch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.dsp-switch input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--dsw-alias-accent, #90AFFF);
  cursor: pointer;
}
.dsp-hint {
  color: var(--dsw-alias-label-tertiary, #888);
  font-size: 11px;
}

.dsp-column-stat {
  flex: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-column-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 6px 8px;
}
/* A column body is a flex container with a definite height once the panel gives
   it one, so its children shrink to fit instead of overflowing -- which means
   the history column silently squashed twelve turns into 39px each and never
   grew a scrollbar. Nothing in a column may shrink. */
.dsp-column-body > *,
.dsp-seg-body > * {
  flex: none;
}
.dsp-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25) inset;
}
/* ---- history column: closed and interrupted turns ---------------------- */
.dsp-history {
  flex: 0 0 300px;
  max-width: 340px;
  background: rgba(128, 128, 128, 0.06);
}
.dsp-seg {
  border: 1px solid rgba(128, 128, 128, 0.22);
  border-radius: 8px;
  overflow: hidden;
}
.dsp-seg-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  background: rgba(128, 128, 128, 0.08);
}
.dsp-seg-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}
.dsp-seg-turn {
  flex: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-seg-outcome {
  flex: none;
  padding: 0 5px;
  border-radius: 999px;
  border: 1px solid rgba(120, 190, 140, 0.55);
  color: rgb(120, 190, 140);
  font-size: 10px;
  line-height: 15px;
}
.dsp-seg-outcome.interrupted {
  border-color: rgba(255, 183, 94, 0.55);
  color: rgb(255, 183, 94);
}
.dsp-seg-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px;
}
.dsp-col-note {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-seg-more {
  align-self: flex-start;
  padding: 2px 0;
  border: none;
  background: none;
  color: var(--dsw-alias-label-secondary, #b8bec8);
  font-size: 11px;
  cursor: pointer;
}
.dsp-seg-more:hover {
  text-decoration: underline;
}
.dsp-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-pill {
  padding: 1px 7px;
  border-radius: 999px;
  font-weight: 600;
  color: var(--dsw-alias-label-primary, #fff);
}
.dsp-pill.ok {
  background: rgba(144, 175, 255, 0.38);
}
.dsp-pill.bad {
  background: rgba(255, 107, 107, 0.32);
}
.dsp-note {
  color: var(--dsw-alias-label-primary, inherit);
}
.dsp-revised {
  padding: 0 5px;
  border-radius: 999px;
  border: 1px solid rgba(255, 183, 94, 0.55);
  color: rgb(255, 183, 94);
  font-size: 10px;
}
.dsp-delta {
  padding: 0 5px;
  border-radius: 999px;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.dsp-delta.up {
  color: rgb(126, 202, 158);
  background: rgba(126, 202, 158, 0.14);
}
.dsp-delta.down {
  color: rgb(255, 168, 120);
  background: rgba(255, 168, 120, 0.14);
}
.dsp-raw {
  margin: 0;
  max-height: 160px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  line-height: 1.5;
  padding: 6px 8px;
  border-radius: 6px;
  background: rgba(128, 128, 128, 0.1);
}
.dsp-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  font-size: 12px;
  color: var(--dsw-alias-label-primary, inherit);
}
.dsp-panel-head {
  flex: none;
  padding: 14px 16px 12px;
  border-bottom: 1px solid rgba(128, 128, 128, 0.2);

  flex-direction: column;
  gap: 6px;
}
.dsp-panel-title {
  font-size: 14px;
  font-weight: 600;
}
.dsp-panel-sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-panel-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dsp-swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: #90AFFF;
  vertical-align: -1px;
  margin-right: 5px;
}
.dsp-form {
  display: grid;
  grid-template-columns: max-content minmax(160px, 280px);
  gap: 8px 12px;
  align-items: center;
}
.dsp-field {
  display: contents;
}
.dsp-field-label {
  font-size: 12px;
  color: var(--dsw-alias-label-secondary, #aaa);
}
.dsp-input {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 28px;
  padding: 0 8px;
  font: inherit;
  font-size: 12px;
  color: var(--dsw-alias-label-primary, inherit);
  background: var(--dsw-alias-bg-layer-2, rgba(127, 127, 127, 0.12));
  border: 1px solid var(--dsw-alias-border-l2, rgba(127, 127, 127, 0.28));
  border-radius: 6px;
  outline: none;
}
.dsp-input:focus {
  border-color: #90afff;
}
.dsp-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.dsp-btn {
  height: 28px;
  padding: 0 14px;
  font: inherit;
  font-size: 12px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: #90afff;
  color: #10203d;
  cursor: pointer;
}
.dsp-btn.ghost {
  background: transparent;
  border-color: var(--dsw-alias-border-l2, rgba(127, 127, 127, 0.35));
  color: var(--dsw-alias-label-secondary, #aaa);
}
.dsp-inline {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.dsp-inline-wrap {
  flex-wrap: wrap;
}
.dsp-color {
  width: 44px;
  padding: 2px;
  cursor: pointer;
}
.dsp-code,
.dsp-range-value {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-range {
  flex: 1;
  min-width: 120px;
  height: 28px;
}
.dsp-range-value {
  flex: none;
  width: 36px;
  text-align: right;
}
/* The preview carries the same data-row-key prefix as a real session row, so
   it is painted by exactly the rules the sidebar uses. */
.dsp-preview-row {
  display: flex;
  align-items: center;
  height: 32px;
  padding: 0 8px;
  border: 1px dashed rgba(128, 128, 128, 0.28);
  border-radius: var(--dsw-radius-md, 8px);
  overflow: hidden;
}
.dsp-preview-title {
  font-size: 13px;
  color: var(--dsw-alias-label-primary, inherit);
}
.dsp-status {
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, #888);
}

  body { margin: 0; padding: 18px; background: #17181c; color: #e6e8eb; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }

</style>
