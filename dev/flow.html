<!doctype html>
<meta charset="utf-8">
<title>flow probe</title>
<style>
  body { margin: 0; padding: 24px; background: #17181c; color: #e6e8eb; font: 14px system-ui, sans-serif; }
  
@property --dsp-p {
  syntax: "<percentage>";
  /* must inherit: the value is set on the row, the band is drawn by ::after */
  inherits: true;
  initial-value: 0%;
}
[data-row-key^="session:"] {
  position: relative;
  isolation: isolate;
}
[data-row-key^="session:"]::after {
  content: "";
  position: absolute;
  z-index: -2;
  pointer-events: none;
  inset-block: 0;
  inset-inline-start: 0;
  /* The paint (background, radius, thickness, clip) comes from the look
     stylesheet below, which the settings can swap at runtime. */
  width: var(--dsp-p, 0%);
  opacity: var(--dsp-o, 0);
  transition:
    --dsp-p 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
    opacity 280ms ease;
}
/* A highlight that keeps travelling inside the filled part, so a band that has
   not moved for half a minute still looks alive. It rides on ::before rather
   than ::after because the fill already owns ::after; z-index -1 puts it over
   the fill (-2) and both stay under the row's text. The sweep is a transform, so
   it runs on the compositor instead of repainting the gradient sixty times a
   second; the clip keeps it inside the filled width. */
[data-row-key^="session:"]::before {
  content: "";
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  width: 100%;
  border-radius: inherit;
  z-index: -1;
  pointer-events: none;
  clip-path: inset(0 calc(100% - var(--dsp-p, 0%)) 0 0);
  background: linear-gradient(
    100deg,
    rgba(255, 255, 255, 0) 38%,
    rgba(255, 255, 255, 0.18) 46%,
    rgba(255, 255, 255, 0.42) 50%,
    rgba(255, 255, 255, 0.18) 54%,
    rgba(255, 255, 255, 0) 62%
  );
  animation: dsp-flow 3.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  /* the highlight fades in and out with the band, never on its own */
  opacity: var(--dsp-o, 0);
  transition:
    clip-path 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
    opacity 280ms ease;
}
@keyframes dsp-flow {
  from {
    transform: translateX(-108%);
  }
  to {
    transform: translateX(108%);
  }
}
@media (prefers-reduced-motion: reduce) {
  [data-row-key^="session:"]::after {
    transition: none;
  }
  [data-row-key^="session:"]::before {
    animation: none;
    transition: none;
    opacity: 0;
  }
}
.dsp-card {
  display: flex;
  flex-direction: column;

  padding: 4px 0 8px;

.dsp-empty {

  padding: 8px 10px;

  flex-direction: column;
  gap: 6px;
}
/* One column per session, left to right: the head names the session, the body
   scrolls its own samples, so several running sessions stay comparable. */
.dsp-columns {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 12px;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 2px;
}
.dsp-column {
  flex: 1 1 300px;
  min-width: 264px;
  max-width: 480px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(128, 128, 128, 0.22);
  border-radius: 10px;
  overflow: hidden;
  background: var(--dsw-alias-bg-layer-1, transparent);
}
/* Inside the full-height rail panel the columns take the remaining height and
   scroll on their own; in the settings card they simply grow with the page. */
.dsp-panel-body > .dsp-columns {
  flex: 1;
  align-items: stretch;
}
.dsp-panel-body > .dsp-columns > .dsp-column {
  max-height: 100%;
}
.dsp-column-head {

  align-items: center;
  gap: 7px;

.dsp-column-title {

  font-size: 12px;

  color: var(--dsw-alias-label-primary, inherit);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dsp-tokens {

}

.dsp-column-stat {
  flex: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--dsw-alias-label-tertiary, #888);
}
.dsp-column-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px;
}
/* A column body is a flex container with a definite height once the panel gives
   it one, so its children shrink to fit instead of overflowing -- which means
   the history column silently squashed twelve turns into 39px each and never
   grew a scrollbar. Nothing in a column may shrink. */
.dsp-column-body > *,
.dsp-seg-body > * {
  flex: none;
}
.dsp-dot {

}

.dsp-panel {

.dsp-actions {

.dsp-btn {

.dsp-inline {

.dsp-code,

/* The preview carries the same data-row-key prefix as a real session row, so
   it is painted by exactly the rules the sidebar uses. */
.dsp-preview-row {

}
.dsp-status {

}

  .row { display: flex; align-items: center; height: 32px; padding: 0 8px; gap: 0;
         border-radius: 8px; color: #e6e8eb; margin-bottom: 8px; width: 320px; }
  .slot { width: 16px; height: 20px; flex: none; }
  .title { flex: 1; margin: 0 6px 0 4px; font-size: 14px; }

</style>

  <div class="row" role="treeitem" data-row-key="session:flow-a" style="--dsp-p:62%;--dsp-o:0.6">
    <span class="slot"></span>
    <span class="title">流动的高光</span>
    <span class="time">3 分钟前</span>
  </div>

  <div class="row" role="treeitem" data-row-key="session:flow-b" style="--dsp-p:18%;--dsp-o:0.6">
    <span class="slot"></span>
    <span class="title">很短的填充</span>
    <span class="time">3 分钟前</span>
  </div>

  <div class="row" role="treeitem" data-row-key="session:flow-c" style="--dsp-p:100%;--dsp-o:0.6">
    <span class="slot"></span>
    <span class="title">满格</span>
    <span class="time">3 分钟前</span>
  </div>
<script>
  window.__probe = () => [...document.querySelectorAll('.row')].map((node) => {
    const before = getComputedStyle(node, '::before')
    const after = getComputedStyle(node, '::after')
    return {
      key: node.dataset.rowKey,
      height: Math.round(node.getBoundingClientRect().height),
      sheenAnimation: before.animationName,
      sheenDuration: before.animationDuration,
      sheenIterations: before.animationIterationCount,
      sheenClip: before.clipPath,
      sheenZ: before.zIndex,
      sheenBg: before.backgroundImage.slice(0, 46),
      fillZ: after.zIndex,
      fillWidth: after.width,
    }
  })
</script>
